<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f4f7fb">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="stylesheet" href="/css/app.css">
  <title>Organisateur</title>
</head>
<body>
  <div id="app" class="appShell">
    <header class="topbar">
      <div>
        <h1 id="pageTitle">Accueil</h1>
        <div id="pageSubtitle" class="muted"></div>
      </div>
      <button id="topAction" class="btn primary">+ Tâche</button>
    </header>
    <main id="view"></main>
    <button id="fab" class="fab" aria-label="Ajouter une tâche">+</button>
    <nav class="bottomnav" aria-label="Navigation principale">
      <button data-route="home" class="active"><span class="navIcon">⌂</span>Accueil</button>
      <button data-route="tasks"><span class="navIcon">☑︎</span>Tâches</button>
      <button data-route="agenda"><span class="navIcon">▤</span>Agenda</button>
      <button data-route="mail"><span class="navIcon">✉</span>Mail</button>
      <button data-route="settings"><span class="navIcon">⚙</span>Réglages</button>
    </nav>
  </div>
  <input id="restoreFile" type="file" accept=".json" hidden>
  <div id="modalRoot"></div>
  <div id="toastRoot"></div>
  <script defer src="/js/boot.js?v=4.0.3"></script>
</body>
</html>
