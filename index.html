<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f4f7fb">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="stylesheet" href="/css/app.css">
  <title>Coordo V2</title>
</head>
<body>
  <div id="app">
    <header class="top">
      <div>
        <div class="eyebrow">Coordo V2</div>
        <h1 id="pageTitle">Accueil</h1>
        <div id="pageSubtitle" class="muted">Organiseur personnel</div>
      </div>
      <button id="topAction" class="btn primary">+ Tâche</button>
    </header>

    <main id="view"></main>

    <button id="fab" class="fab">+</button>

    <nav class="bottomnav">
      <button data-route="home" class="active"><span>⌂</span>Accueil</button>
      <button data-route="tasks"><span>☑︎</span>Tâches</button>
      <button data-route="agenda"><span>▤</span>Agenda</button>
      <button data-route="mail"><span>✉</span>Mail</button>
      <button data-route="settings"><span>⚙</span>Réglages</button>
    </nav>
  </div>

  <input id="restoreFile" type="file" accept=".json" hidden>
  <div id="modalRoot"></div>

  <script defer src="/js/app.js"></script>
</body>
</html>
